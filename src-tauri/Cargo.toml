[package]
name = "hybridchat"
version = "0.1.0"
description = "A local multi-session chat client for HybridAgent"
authors = ["HybridAgent"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = [] }
